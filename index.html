<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>@_yumicorn | Links</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <div class="image-container">
      <img
        src="https://i.imgur.com/gm0bcbz.jpg"
        alt="@_yumicorn profile photo"
      />
    </div>

    <h1>@_yumicorn</h1>
    <p class="bio">Mother Chef • Content Creator • Hong Kong ✨</p>

    <nav class="social-icons" aria-label="Social links">
      <a
        href="https://www.instagram.com/_yumicorn"
        class="social-icon"
        title="@_yumicorn"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="https://i.imgur.com/gm0bcbz.jpg"
          alt="@_yumicorn"
        />

      </a>

      <a
        href="https://www.instagram.com/girlsofhongkong"

          src="https://i.imgur.com/8yKxBrE.jpg"

        />

      </a>

      <a
        href="mailto:business@mayumiverse.com"
        class="social-icon"
        title="Email"
      >
        <div class="email-icon" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 256 256"
            fill="none"
            stroke="currentColor"
            stroke-width="14"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="32" y="64" width="192" height="160" rx="8" ry="8"></rect>
            <polyline points="224,64 128,144 32,64"></polyline>
          </svg>
        </div>

    <div class="divider" aria-hidden="true"></div>

    <a

      class="tile"
      target="_blank"
      rel="noopener noreferrer"
    >
      <div class="icon" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 256 256"
          fill="none"
          stroke="currentColor"
          stroke-width="16"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="40" y="40" width="176" height="176" rx="48"></rect>
          <circle cx="128" cy="128" r="40"></circle>
          <circle cx="180" cy="76" r="10"></circle>
        </svg>

    <a
      href="https://www.instagram.com/fboyumi"
      class="tile"
      target="_blank"

      <div class="icon" aria-hidden="true">

          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 256 256"
          fill="none"
          stroke="currentColor"
          stroke-width="16"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M128 216s-72-40.6-72-104a40 40 0 0 1 72-24 40 40 0 0 1 72 24c0 63.4-72 104-72 104Z"></path>
        </svg>
      </div>
      <p>Lifestyle account @fboyumi</p>

    <a
      href="mailto:business@mayumiverse.com"
      class="tile"
    >
      <div class="icon" aria-hidden="true">

          fill="none"

        >
          <rect x="32" y="64" width="192" height="160" rx="8" ry="8"></rect>
          <polyline points="224,64 128,144 32,64"></polyline>
